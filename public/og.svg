<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="MyTasks — a simple to-do app built for focus">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#292929"/>
      <stop offset="100%" stop-color="#414141"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#e2b4bd"/>

  <g transform="translate(96 118)">
    <g stroke="#e2b4bd" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
