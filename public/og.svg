    </g>
    <text x="60" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="600" letter-spacing="2" fill="#fff5f5">MYTASKS</text>
  </g>

  <text x="96" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#fff5f5">A simple to-do app</text>
  <text x="96" y="382" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#e2b4bd">built for focus.</text>

  <text x="96" y="456" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="31" fill="#fff5f5" opacity="0.62">Capture in a keystroke. No setup. No clutter.</text>

