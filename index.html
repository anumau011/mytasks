        <h1 style="font-size: 2rem; line-height: 1.2">
          MyTasks — a simple to-do app built for focus
        </h1>
        <p>
          MyTasks is a <strong>minimalist task manager</strong> for people worn down by
          bloated project software. Capture a task in one keystroke, keep a
          <strong>daily task tracker</strong> that loads instantly, and get back to the
          work itself. The app needs JavaScript to run, so please enable it.
        </p>
        <h2>Why a simple to-do app</h2>
        <ul>
          <li>
            <strong>Lightning-fast capture.</strong> Type the task, press Enter. That is
            the whole ritual.
          </li>
          <li>
            <strong>Zero learning curve.</strong> Nothing to configure before your first
            task.
          </li>
          <li>
            <strong>Less mental clutter.</strong> One list, not eleven views of the same
            list.
          </li>
          <li>
            <strong>Cross-device sync.</strong> Tasks live on your account, not in one
            browser.
          </li>
        </ul>
        <h2>Two ways to work</h2>
        <p>
          Keep a project as a flat checklist, or split it into sections with a to-do /
          in-progress / done board. You choose per project.
        </p>
